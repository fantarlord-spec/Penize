<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт часов и зарплаты</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--green:#15803d;--red:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--text:#eef0f3;--muted:#98a1ad;--line:#2a313b;--accent:#5b9bff;--green:#4ade80;--red:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--text:#eef0f3;--muted:#98a1ad;--line:#2a313b;--accent:#5b9bff;--green:#4ade80;--red:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);padding:4px 8px;font-size:20px;line-height:1;flex:0 0 auto}
.add{margin-top:10px;width:100%}
.sum div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0;font-size:20px;font-weight:700;padding-top:12px}
.neg{color:var(--red)}.pos{color:var(--green)}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li span:first-child{flex:1}
li b{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Учёт часов и зарплаты</h1>

<div class="card">
  <div class="row">
    <div><label>Месяц</label><input type="month" id="month"></div>
    <div><label>Ставка за час</label><input type="number" id="rate" inputmode="decimal" min="0" step="any" placeholder="0"></div>
    <div style="flex:0 0 70px"><label>Валюта</label><input id="cur" maxlength="4" placeholder="₽"></div>
  </div>
</div>

<div class="card sum" id="sum"></div>

<div class="card">
  <h2>Отработанные часы</h2>
  <div class="row">
    <div><label>Дата</label><input type="date" id="eDate"></div>
    <div><label>Часы</label><input id="eHours" inputmode="decimal" placeholder="8 или 8:30"></div>
  </div>
  <button class="add" id="addE">Добавить смену</button>
  <div class="hint">Часы можно вводить как 8, 7.5 или 8:30</div>
  <ul id="eList"></ul>
</div>

<div class="card">
  <h2>Отпуск</h2>
  <div class="row">
    <div><label>Начало</label><input type="date" id="vDate"></div>
    <div><label>Дней</label><input id="vDays" inputmode="decimal" placeholder="14"></div>
    <div><label>Оплата за день</label><input type="number" id="vRate" inputmode="decimal" min="0" step="any" placeholder="0"></div>
  </div>
  <button class="add" id="addV">Добавить отпуск</button>
  <ul id="vList"></ul>
</div>

<div class="card">
  <h2>Командировочные</h2>
  <div class="row">
    <div><label>Начало</label><input type="date" id="tDate"></div>
    <div><label>Дней</label><input id="tDays" inputmode="decimal" placeholder="3"></div>
    <div><label>Выплата за день</label><input type="number" id="tRate" inputmode="decimal" min="0" step="any" placeholder="0"></div>
  </div>
  <button class="add" id="addT">Добавить командировку</button>
  <ul id="tList"></ul>
</div>

<div class="card">
  <h2>Авансы</h2>
  <div class="row">
    <div><label>Дата</label><input type="date" id="aDate"></div>
    <div><label>Сумма</label><input type="number" id="aSum" inputmode="decimal" min="0" step="any" placeholder="0"></div>
  </div>
  <button class="add" id="addA">Добавить аванс</button>
  <ul id="aList"></ul>
</div>
</main>

<script>
(function(){
  var KEY='hours-tracker-v1';
  var S={rate:0,cur:'₽',entries:[],advances:[],vac:[],trips:[],vacRate:0,tripRate:0};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object')S=Object.assign(S,p)}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var today=new Date();
  var pad=function(n){return String(n).padStart(2,'0')};
  var todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  $('month').value=todayStr.slice(0,7);
  $('eDate').value=todayStr;$('aDate').value=todayStr;$('vDate').value=todayStr;$('tDate').value=todayStr;
  $('vRate').value=S.vacRate||'';$('tRate').value=S.tripRate||'';
  $('rate').value=S.rate||'';$('cur').value=S.cur;

  function fmt(n){return n.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2})}
  function fmtH(min){var h=Math.floor(min/60),m=Math.round(min%60);return h+' ч'+(m?' '+m+' мин':'')}
  function parseH(s){
    s=String(s).trim().replace(',','.');
    if(!s)return NaN;
    if(s.indexOf(':')>-1){var a=s.split(':');var h=parseFloat(a[0]),m=parseFloat(a[1]||0);if(isNaN(h)||isNaN(m))return NaN;return Math.round(h*60+m)}
    var v=parseFloat(s);return isNaN(v)?NaN:Math.round(v*60);
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function dateRu(d){var a=d.split('-');return a[2]+'.'+a[1]}

  function render(){
    var mo=$('month').value;
    var es=S.entries.filter(function(e){return e.date.slice(0,7)===mo}).sort(function(a,b){return a.date<b.date?-1:1});
    var as=S.advances.filter(function(e){return e.date.slice(0,7)===mo}).sort(function(a,b){return a.date<b.date?-1:1});
    var min=es.reduce(function(s,e){return s+e.min},0);
    var adv=as.reduce(function(s,e){return s+e.amount},0);
    var vs=(S.vac||[]).filter(function(e){return e.date.slice(0,7)===mo}).sort(function(a,b){return a.date<b.date?-1:1});
    var ts=(S.trips||[]).filter(function(e){return e.date.slice(0,7)===mo}).sort(function(a,b){return a.date<b.date?-1:1});
    var vac=vs.reduce(function(s,e){return s+e.days*e.perDay},0);
    var trip=ts.reduce(function(s,e){return s+e.days*e.perDay},0);
    var vDays=vs.reduce(function(s,e){return s+e.days},0);
    var tDays=ts.reduce(function(s,e){return s+e.days},0);
    var gross=min/60*(+S.rate||0);
    var net=gross+vac+trip-adv;
    var c=' '+(S.cur||'');
    $('sum').innerHTML=
      '<div><span>Отработано</span><b>'+fmtH(min)+'</b></div>'+
      '<div><span>За отработанные часы</span><b>'+fmt(gross)+c+'</b></div>'+
      (vs.length?'<div><span>Отпускные ('+fmt(vDays)+' дн.)</span><b>+'+fmt(vac)+c+'</b></div>':'')+
      (ts.length?'<div><span>Командировочные ('+fmt(tDays)+' дн.)</span><b>+'+fmt(trip)+c+'</b></div>':'')+
      '<div><span>Авансы</span><b class="'+(adv?'neg':'')+'">−'+fmt(adv)+c+'</b></div>'+
      '<div><span>К выплате</span><b class="'+(net<0?'neg':'pos')+'">'+fmt(net)+c+'</b></div>';
    $('eList').innerHTML=es.length?es.map(function(e){
      return '<li><span>'+dateRu(e.date)+'</span><b>'+fmtH(e.min)+'</b><button class="ghost" data-e="'+e.id+'" aria-label="Удалить">×</button></li>'}).join(''):'<div class="empty">Смен за этот месяц пока нет</div>';
    function dl(list,k,empty){return list.length?list.map(function(e){return '<li><span>'+dateRu(e.date)+' · '+fmt(e.days)+' дн. × '+fmt(e.perDay)+'</span><b>'+fmt(e.days*e.perDay)+c+'</b><button class="ghost" data-'+k+'="'+e.id+'" aria-label="Удалить">×</button></li>'}).join(''):'<div class="empty">'+empty+'</div>'}
    $('vList').innerHTML=dl(vs,'v','Отпуска в этом месяце нет');
    $('tList').innerHTML=dl(ts,'t','Командировок в этом месяце нет');
    $('aList').innerHTML=as.length?as.map(function(e){
      return '<li><span>'+dateRu(e.date)+'</span><b>'+fmt(e.amount)+c+'</b><button class="ghost" data-a="'+e.id+'" aria-label="Удалить">×</button></li>'}).join(''):'<div class="empty">Авансов за этот месяц нет</div>';
  }

  $('month').addEventListener('change',render);
  $('rate').addEventListener('input',function(){S.rate=parseFloat(this.value)||0;save();render()});
  $('cur').addEventListener('input',function(){S.cur=this.value;save();render()});
  $('addE').addEventListener('click',function(){
    var m=parseH($('eHours').value),d=$('eDate').value;
    if(!d||isNaN(m)||m<=0){$('eHours').focus();return}
    S.entries.push({id:uid(),date:d,min:m});save();
    $('eHours').value='';
    if(d.slice(0,7)!==$('month').value)$('month').value=d.slice(0,7);
    render();
  });
  $('addA').addEventListener('click',function(){
    var v=parseFloat($('aSum').value),d=$('aDate').value;
    if(!d||isNaN(v)||v<=0){$('aSum').focus();return}
    S.advances.push({id:uid(),date:d,amount:v});save();
    $('aSum').value='';
    if(d.slice(0,7)!==$('month').value)$('month').value=d.slice(0,7);
    render();
  });
  $('vRate').addEventListener('input',function(){S.vacRate=parseFloat(this.value)||0;save()});
  $('tRate').addEventListener('input',function(){S.tripRate=parseFloat(this.value)||0;save()});
  function addDays(key,dId,nId,rId){
    var d=$(dId).value,n=parseFloat($(nId).value.replace(',','.')),r=parseFloat($(rId).value)||0;
    if(!d||isNaN(n)||n<=0){$(nId).focus();return}
    if(!S[key])S[key]=[];
    S[key].push({id:uid(),date:d,days:n,perDay:r});save();
    $(nId).value='';
    if(d.slice(0,7)!==$('month').value)$('month').value=d.slice(0,7);
    render();
  }
  $('addV').addEventListener('click',function(){addDays('vac','vDate','vDays','vRate')});
  $('addT').addEventListener('click',function(){addDays('trips','tDate','tDays','tRate')});
  document.addEventListener('click',function(ev){
    var t=ev.target;if(!t.dataset)return;
    if(t.dataset.e){S.entries=S.entries.filter(function(e){return e.id!==t.dataset.e});save();render()}
    if(t.dataset.a){S.advances=S.advances.filter(function(e){return e.id!==t.dataset.a});save();render()}
    if(t.dataset.v){S.vac=S.vac.filter(function(e){return e.id!==t.dataset.v});save();render()}
    if(t.dataset.t){S.trips=S.trips.filter(function(e){return e.id!==t.dataset.t});save();render()}
  });
  render();
})();
</script>
</body>
</html>
